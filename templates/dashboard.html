<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link href="{{ url_for('static', filename='dist/output.css') }}" rel="stylesheet" />
</head>
<body class="bg-gray-100 h-screen flex flex-col items-center justify-center">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-lg">
    <h1 class="text-3xl font-semibold text-center text-gray-800 mb-6">Welcome to Your Dashboard!</h1>
    
    <p class="text-xl text-gray-700 mb-4"><strong>Username:</strong> {{ user[1] }}</p>

    <a href="{{ url_for('logout') }}" class="text-blue-500 hover:underline mb-6 block text-center">Logout</a>

    <h2 class="text-2xl font-medium text-gray-800 mb-4">Add a New Task</h2>
    <form action="/add_task" method="POST" class="space-y-4">
      <input type="hidden" name="user_id" value="{{ user[1] }}">

      <div>
        <input type="text" name="task" placeholder="Enter your task" required class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <input type="text" name="task_type" placeholder="Type (e.g., personal/work)" required class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="mb-4">
        <label for="table_name" class="block text-gray-700 mb-2">Choose Quadrant:</label>
        <select name="table_name" required class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="urgent_important" selected>Urgent and Important</option>
          <option value="not_urgent_important">Not Urgent and Important</option>
          <option value="urgent_not_important">Urgent & Not Important</option>
          <option value="not_urgent_not_important">Not Urgent & Not Important</option>
        </select>
      </div>

      <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
        Add Task
      </button>
    </form>

    <h2 class="text-2xl font-medium text-gray-800 mt-8 mb-4">Current Tasks</h2>
<ul class="list-disc pl-5">
  {% for task, task_type in current_tasks[0] %}
    <li class="text-gray-700 mb-2 flex justify-between items-center">
      <span><strong>{{ task }}</strong> ({{ task_type }})</span>
      <form action="/delete_task" method="POST" class="inline-block ml-4">
        <input type="hidden" name="task" value="{{ task }}">
        <input type="hidden" name="table_name" value="{{ current_tasks[1] }}">
        <button type="submit" class="bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600">
          Delete
        </button>
      </form>
    </li>
  {% else %}
    <li class="text-gray-500">No tasks yet.</li>
  {% endfor %}
</ul>
  </div>
</body>
</html>
